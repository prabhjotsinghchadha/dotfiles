# draw_bold_text_with_bright_colors = true
colors.draw_bold_text_with_bright_colors = true

[window]
decorations = "Full"
startup_mode = "Fullscreen"

[scrolling]
history = 10_000

[font]
size = 20

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
style = "Semibold"

[font.italic]
style = "Italic"

[colors.primary]
background = "0x282828"
foreground = "0xebdbb2"
dim_foreground = "0xa89984"
bright_foreground = "0xfbf1c7"

[colors.cursor]
text = "0x282828"
cursor = "0xebdbb2"

[colors.normal]
black = "0x282828"
red = "0xcc241d"
green = "0x98971a"
yellow = "0xd79921"
blue = "0x458588"
magenta = "0xb16286"
cyan = "0x689d6a"
white = "0xa89984"

[colors.bright]
black = "0x928374"
red = "0xfb4934"
green = "0xb8bb26"
yellow = "0xfabd2f"
blue = "0x83a598"
magenta = "0xd3869b"
cyan = "0x8ec07c"
white = "0xebdbb2"

[colors.dim]
black = "0x32302f"
red = "0x9d0006"
green = "0x79740e"
yellow = "0xb57614"
blue = "0x076678"
magenta = "0x8f3f71"
cyan = "0x427b58"
white = "0x928374"

[cursor.style]
shape = "Block"
blinking = "Off"

[[keyboard.bindings]]
key = "Key6"
mods = "Control"
chars = "\u001e"

[[keyboard.bindings]]
key = "Key9"
mods = "Command"
action = "ResetFontSize"
